name = "nikke-profile-verify"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-05"
workers_dev = true

# Wrangler 4.151+ provisions the namespace on deploy if the binding has no ID.
[[kv_namespaces]]
binding = "SERVICE_SESSION_KV"

# Refresh the service session once per day (03:00 UTC / 12:00 Korea time).
[triggers]
crons = ["0 3 * * *"]
