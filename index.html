<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIKKE 프로필 인증 테스트</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#eef3ff;font-family:Arial,"Noto Sans KR",sans-serif}.card{width:min(620px,100%);background:#151d31;border:1px solid #33415f;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}h1{margin:0 0 10px;font-size:24px}.desc{color:#aebbd1;line-height:1.7;font-size:14px}.status{margin-top:20px;padding:16px;border-radius:10px;background:#0d1527;border:1px solid #2b3853;white-space:pre-wrap;min-height:58px}button{margin-top:16px;width:100%;padding:14px;border:1px solid #927dff;border-radius:10px;background:#29234b;color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:#342d60}.log{margin-top:16px;padding:12px;border-radius:10px;background:#0a1120;border:1px solid #25324b;color:#95a4bd;font:12px/1.6 Consolas,monospace;min-height:70px}</style></head><body><main class="card"><h1>NIKKE 프로필 소유권 인증 테스트</h1><div class="desc">메인 니케 장비관리 사이트와 완전히 분리된 독립 테스트 페이지입니다.<br>현재는 페이지 로딩과 버튼 동작만 테스트합니다.</div><div id="status" class="status">상태: 대기 중</div><button id="test" type="button">테스트 시작</button><div id="log" class="log"></div></main><script>(function(){"use strict";var s=document.getElementById("status"),b=document.getElementById("test"),l=document.getElementById("log");function log(t){var d=document.createElement("div");d.textContent=new Date().toLocaleTimeString()+"  "+t;l.appendChild(d)}log("페이지 로드 완료");b.addEventListener("click",function(){s.textContent="상태: 버튼 클릭 정상\n인증 기능은 아직 연결하지 않았습니다.";log("버튼 클릭 이벤트 정상")})})();</script></body></html>
