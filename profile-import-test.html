<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlaBlaLink 프로필 캐릭터 가져오기</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:28px auto;padding:20px;background:#080d19;color:#edf2ff}input,button{font-size:15px;padding:9px;margin:4px 0}input{width:100%;box-sizing:border-box;background:#0d1527;color:#fff;border:1px solid #394867;border-radius:7px}button{background:#927dff;color:#fff;border:0;border-radius:7px;font-weight:800;cursor:pointer}#status,#list{white-space:pre-wrap;margin-top:14px;padding:12px;background:#10192c;border:1px solid #26324b;border-radius:8px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px;border-bottom:1px solid #26324b}.muted{color:#9eabc1;font-size:13px}</style></head><body><h2>BlaBlaLink 프로필 캐릭터 불러오기</h2><p class="muted">기존 계정동기화와 별도로 공개 프로필의 NIKKE 캐릭터 정보를 조회합니다.</p><input id="url" placeholder="https://www.blablalink.com/user?openid=..."><button id="load">캐릭터 정보 불러오기</button><div id="status">대기 중</div><div id="list"></div><script>const status=document.getElementById('status'),list=document.getElementById('list');function decodeOpenId(u){const x=new URL(u);const v=x.searchParams.get('openid');if(!v)throw Error('URL에서 openid를 찾지 못했습니다.');let s=atob(v.replace(/-/g,'+').replace(/_/g,'/'));while(s.length%4)s+='=';return s.includes('-')?s.split('-').slice(-1)[0]:s}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function getName(c){return c.nickname||c.name||c.role_name||c.character_name||c.name_code||c.character_id||c.id||'알 수 없음'}function getLevel(c){return c.level??c.lv??c.character_level??c.core??''}window.addEventListener('NIKKE_GM_PROFILE_RESULT',e=>{const d=e.detail||{};if(!d.ok){status.textContent='실패: '+(d.error||'조회 실패');list.textContent='';return}const arr=Array.isArray(d.characters)?d.characters:[];status.textContent='조회 성공 · 서버 '+d.area+' · 캐릭터 '+arr.length+'명';if(!arr.length){list.textContent='응답은 성공했지만 캐릭터 목록이 비어 있습니다.\n\n'+JSON.stringify(d.raw||{},null,2);return}list.innerHTML=arr.map(c=>'<div class="row"><b>'+esc(getName(c))+'</b><span>레벨 '+esc(getLevel(c))+'</span></div>').join('')});document.getElementById('load').onclick=()=>{list.textContent='';try{const id=decodeOpenId(document.getElementById('url').value.trim());status.textContent='프로필 링크 확인 완료. BlaBlaLink API 중계 요청 중...';window.dispatchEvent(new CustomEvent('NIKKE_GM_PROFILE_IMPORT',{detail:{intl_open_id:id}}));setTimeout(()=>{if(status.textContent.includes('중계 요청 중'))status.textContent='실패: Tampermonkey 1.0.25 중계 기능이 실행되지 않았습니다. 새 스크립트를 설치/업데이트한 뒤 다시 시도하세요.'},15000)}catch(e){status.textContent='실패: '+e.message}};</script></body></html>
