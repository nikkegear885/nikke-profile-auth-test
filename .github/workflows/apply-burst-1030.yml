name: Apply Burst Display 1.030

on:
  push:
    paths:
      - '.apply-burst-1030'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply burst display
        shell: python
        run: |
          from pathlib import Path
          p = Path('pedia.js')
          s = p.read_text(encoding='utf-8')
          old = "title.textContent=name+' · 스킬 정보';if(meta)meta.textContent='사이트 내부 저장 데이터 · 외부 요청 없음';"
          new = "title.textContent=name+' · 스킬 정보';if(meta){const burst=data?.b??'';meta.textContent=(burst?'버스트 '+burst+'단계 · ':'')+'사이트 내부 저장 데이터 · 외부 요청 없음';}"
          if old not in s:
              raise SystemExit('target renderPediaSkills line not found')
          s = s.replace(old, new, 1)
          s = s.replace("assets/nikke-skills.json?v=1029", "assets/nikke-skills.json?v=1030", 1)
          p.write_text(s, encoding='utf-8')
          Path('VERSION').write_text('1.030\n', encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pedia.js VERSION
          git commit -m 'feat: show burst stage in pedia skill modal' || exit 0
          git push
