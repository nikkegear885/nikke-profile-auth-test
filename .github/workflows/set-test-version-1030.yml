name: Set test site version 1.030
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync version 1.030
        shell: bash
        run: |
          set -e
          if [ -f index.html ]; then
            sed -i 's/GitHub Pages deployment refresh 0\.355/GitHub Pages deployment refresh 1.030/g; s/GitHub Pages deployment refresh 1\.029/GitHub Pages deployment refresh 1.030/g; s/VERSION 1\.029/VERSION 1.030/g; s/pedia\.js?v=1029/pedia.js?v=1030/g' index.html
          fi
          if [ -f pedia.js ]; then
            sed -i 's/nikke-skills\.json?v=1029/nikke-skills.json?v=1030/g' pedia.js
          fi
          printf '1.030\n' > VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION pedia.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: sync test site to v1.030'
          git push origin main
