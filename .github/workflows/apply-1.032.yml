name: Apply pedia company class UI 1.032
on:
  push:
    paths:
      - '.github/workflows/apply-1.032.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('pedia.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/nikke-skills.json?v=1031','assets/nikke-skills.json?v=1032')

          patch = r'''

// v1.032: 도감 스킬창에 기업/클래스 표시
(function(){
  const STYLE_ID='pedia-company-class-v1032';
  function style(){
    if(document.getElementById(STYLE_ID)) return;
    const st=document.createElement('style'); st.id=STYLE_ID;
    st.textContent=`
      .pedia-profile-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
      .pedia-profile-chip{display:inline-flex;align-items:center;padding:4px 8px;border:1px solid #bfd5df;border-radius:6px;background:#fff;color:#4f6878;font-size:9px;font-weight:900;line-height:1.2}
      .pedia-profile-chip strong{color:#294b5e;margin-right:4px}
      html.dark-theme .pedia-profile-chip{background:#101827;border-color:#344660;color:#b9c7da}
      html.dark-theme .pedia-profile-chip strong{color:#edf3ff}
    `;
    document.head.appendChild(st);
  }
  function norm(v){return String(v??'').normalize('NFKC').toLowerCase().replace(/[\s:：·•._'’“”"`\-–—()\[\]{}]/g,'');}
  let cache=null;
  async function load(){
    if(cache)return cache;
    try{const r=await fetch('assets/nikke-skills.json?v=1032',{cache:'no-store'});if(!r.ok)return null;cache=await r.json();return cache;}catch(_){return null;}
  }
  function find(all,name){
    if(!all||typeof all!=='object')return null;
    if(all[name])return all[name];
    const wanted=norm(name);
    const hit=Object.entries(all).find(([k,v])=>norm(k)===wanted||norm(v?.name)===wanted);
    return hit?hit[1]:null;
  }
  async function apply(){
    style();
    const modal=document.getElementById('pediaSkillModal');
    if(!modal||!modal.classList.contains('open'))return;
    const title=modal.querySelector('#pediaSkillTitle');
    if(!title)return;
    const raw=title.textContent||'';
    const name=raw.replace(/\s*·\s*스킬 정보\s*$/,'').trim();
    if(!name)return;
    const all=await load(); const d=find(all,name); if(!d)return;
    let wrap=modal.querySelector('.pedia-profile-meta');
    if(!wrap){
      wrap=document.createElement('div');wrap.className='pedia-profile-meta';
      title.parentElement.appendChild(wrap);
    }
    const company=String(d.co??'').trim();
    const cls=String(d.c??'').trim();
    wrap.innerHTML='';
    if(company){const x=document.createElement('span');x.className='pedia-profile-chip';x.innerHTML='<strong>기업</strong>'+company;wrap.appendChild(x)}
    if(cls){const x=document.createElement('span');x.className='pedia-profile-chip';x.innerHTML='<strong>클래스</strong>'+cls;wrap.appendChild(x)}
  }
  function init(){
    style();
    const ob=new MutationObserver(()=>apply());
    ob.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
    apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
'''
          if 'v1.032: 도감 스킬창에 기업/클래스 표시' not in s:
              s += patch
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('GitHub Pages deployment refresh 1.031','GitHub Pages deployment refresh 1.032')
          h=h.replace('pedia.js?v=1031','pedia.js?v=1032')
          idx.write_text(h,encoding='utf-8')

          Path('VERSION').write_text('1.032\n',encoding='utf-8')
          PY
          git rm .github/workflows/apply-1.032.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pedia.js index.html VERSION
          git commit -m 'feat: show company and class in pedia skill modal [1.032]'
          git push
