name: Sync production site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: nikkegear885/nikke-
          ref: main
          path: production
          fetch-depth: 1
      - name: Sync
        shell: bash
        run: |
          set -e
          rm -rf production/.git production/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name production ! -name .github -exec rm -rf {} +
          cp -a production/. .
          rm -rf production
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'Sync from production nikke-'
          git push origin main
