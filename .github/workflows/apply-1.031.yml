name: Apply pedia rarity and burst UI 1.031
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test site
        run: python scripts/apply-1.031.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-1.031.yml scripts/apply-1.031.py
          git add pedia.js index.html VERSION
          git commit -m 'feat: color pedia cards by rarity and show burst stage [1.031]'
          git push
