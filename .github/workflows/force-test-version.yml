name: Force test site version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test-only version and cache bust
        shell: bash
        run: |
          set -e
          if [ -f index.html ]; then
            sed -i 's/VERSION 1\.022/VERSION 1.024/g; s/GitHub Pages deployment refresh 0\.355/GitHub Pages deployment refresh 1.024/g; s/pedia\.js?v=012/pedia.js?v=013/g' index.html
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update test site to v1.024'
          git push origin main
