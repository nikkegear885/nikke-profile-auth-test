<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로필 소유권 인증 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#edf2ff;font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(560px,calc(100% - 32px));background:#192237;border:1px solid #34415d;border-radius:16px;padding:28px;box-shadow:0 12px 40px #0005}h1{margin:0 0 10px;font-size:22px}.note{color:#aab6cc;font-size:13px;line-height:1.6}.status{margin:20px 0;padding:14px;border-radius:10px;background:#101827;border:1px solid #2e3b55;color:#b9c5da;white-space:pre-wrap;min-height:52px}.btn{width:100%;padding:13px;border:1px solid #927dff;border-radius:9px;background:#29234b;color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:#342d60}.log{margin-top:16px;font:12px/1.5 Consolas,monospace;color:#91a0ba;max-height:180px;overflow:auto}
</style>
</head>
<body>
<main class="card">
<h1>프로필 소유권 인증 테스트</h1>
<div class="note">기존 니케 장비관리 사이트와 완전히 분리된 테스트 페이지입니다.<br>현재는 페이지 로딩과 버튼 클릭만 테스트합니다.</div>
<div id="status" class="status">인증 상태: 대기 중</div>
<button id="start" class="btn" type="button">계정 인증 테스트 시작</button>
<div id="log" class="log"></div>
</main>
<script>
(function(){
'use strict';
const status=document.getElementById('status');
const button=document.getElementById('start');
const log=document.getElementById('log');
function write(text){const line=document.createElement('div');line.textContent=new Date().toLocaleTimeString()+'  '+text;log.appendChild(line);log.scrollTop=log.scrollHeight;}
button.addEventListener('click',function(){status.textContent='인증 상태: 테스트 버튼 정상 작동';write('버튼 클릭 이벤트 정상');});
write('테스트 페이지 로드 완료');
})();
</script>
</body>
</html>
